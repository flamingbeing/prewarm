<head>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">

     dressed as the original NUHS app in style.css; the look, density and light/dark are chosen per phone in Settings
     (js/ui-settings.js) and early.js puts them back before the first paint -->
<link rel="stylesheet" href="https://core.anawj.com/ui/1.0.0-rc.27/theme/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><div class="row">
  <button id="back" class="iconbtn" aria-label="Back" hidden>‹</button>
  <h1 id="title">Prewarming study</h1>
  <span id="extra"></span>
</div><nav id="ptabs" class="ptabs" role="tablist" aria-label="Readings" hidden></nav></header>
<div id="moved" class="moved" role="status" hidden></div>
<div id="banner" class="banner" role="alert" hidden></div>
<button id="fresh" class="update" hidden>New readings from your team: tap to show them</button>
<main id="view"></main>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
