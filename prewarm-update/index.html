<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f3f3">
<meta name="theme-color" content="#14181c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Update the prewarming app</title>
<link rel="stylesheet" href="https://design.anawj.com/v1/tokens.css">
<style>
  :root { --bg: #f3f3f3; --ink: #1a1f24; --navy: #003473; --card: #fff; --line: #c9ced3; --ok: #1c6b3a; --err: #b42318; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14181c; --ink: #e8ebee; --navy: #8fb8f0; --card: #1d2227; --line: #3a424a; --ok: #6cc38a; --err: #ff8a80; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
  h1 { font-size: 1.3rem; margin: 0; color: var(--navy); }
  button { font: inherit; font-weight: 600; min-height: 52px; border-radius: 10px; border: 0; background: var(--navy); color: #fff; padding: 8px 14px; }
  button:disabled { opacity: .6; }
  p { margin: 0; } .muted { color: var(--ink); opacity: .75; font-size: .95rem; }
  #out { padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  #out.ok { border-color: var(--ok); } #out.err { border-color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>Update the prewarming app</h1>
  <p>Use this when the prewarming app on this phone won’t update by itself.</p>
  <p class="muted">It removes the app’s saved copy of its own code so the newest version loads. <b>Patients and readings on this phone are not touched.</b> You need signal: it checks first.</p>
  <button id="go">Get the latest version</button>
  <p id="out" role="status" hidden></p>
</main>
<script>
const out = (t, c) => { const o = document.getElementById('out'); o.hidden = false; o.className = c || ''; o.textContent = t; };
document.getElementById('go').onclick = async e => {
  e.target.disabled = true;
  try {
    // only go ahead when the newest app can be fetched: otherwise the phone would be left with no saved copy
    const r = await fetch('../prewarm/sw.js?' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('offline');
    let n = 0;
    for (const reg of await navigator.serviceWorker.getRegistrations()) if (/\/prewarm\/$/.test(new URL(reg.scope).pathname)) { await reg.unregister(); n++; }
    for (const k of await caches.keys()) if (k.startsWith('prewarm-')) await caches.delete(k);
    out('Done. Opening the app…', 'ok');
    setTimeout(() => { location.href = '../prewarm/'; }, 600);
  } catch (err) {
    e.target.disabled = false;
    out('Couldn’t reach the app. Check your signal and try again. Nothing was changed.', 'err');
  }
};
</script>
</body>
</html>
